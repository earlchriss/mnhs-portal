ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(functions|includes|admin/includes|admin/data)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(ini|log|sql|bak|env)$)">
    Require all denied
</FilesMatch>
